name: Linux IME
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-ime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Arch / CachyOS native target
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git cmake ninja extra-cmake-modules pkgconf gettext fcitx5 librime opencc curl jsoncpp gtk3 qt6-base gtk-layer-shell python
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build native input method
        run: platforms/linux/ime/scripts/build.sh
      - name: Local core checks
        run: ctest --test-dir platforms/linux/ime/build --output-on-failure
      - name: Isolated native input and delivery checks
        run: platforms/linux/ime/tests/e2e/e2e.sh --skip-display --skip-wayland
